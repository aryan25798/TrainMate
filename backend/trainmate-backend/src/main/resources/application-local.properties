# =====================================================
# LOCAL DEVELOPMENT CONFIGURATION (Local MySQL)
# =====================================================
server.port=8081

# Local MySQL connection (works offline and inside corporate firewalls)
spring.datasource.url=jdbc:mysql://localhost:3306/trainmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=123456

# Enable Flyway to automatically build database schema and seed data
spring.flyway.enabled=true
spring.flyway.default-schema=trainmate
