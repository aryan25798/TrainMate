# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}

# Profile Configuration
spring.profiles.default=local

# Database Configuration
# Locally: override via application-local.properties (git-ignored)
# Production: set these as env vars in Render dashboard
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fast container startup settings
spring.main.lazy-initialization=true

# HikariCP Connection Pool Tuning (instantaneous startup, no blocking initial connection)
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# -1 bypasses initial connection attempt and starts the pool immediately in 0ms
spring.datasource.hikari.initialization-fail-timeout=-1
# Validate connections quickly
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate Configuration
# Schema is strictly managed by SQL/Flyway; none eliminates 30+ seconds of remote schema metadata scans
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable Open-in-View (removes a proxy wrapper overhead on every HTTP request)
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration (default to false on cloud containers since DB is already migrated)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Skip validation on migrate for faster startup (schema is managed by our SQL)
spring.flyway.validate-on-migrate=false
# Connect timeout for Flyway specifically
spring.flyway.connect-retries=3

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Name
spring.application.name=TrainMate

# Jackson Configuration - serialize dates as ISO-8601 strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# SpringDoc OpenAPI - disable at startup, generate on first access
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.cache.disabled=false
