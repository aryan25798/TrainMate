# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}

# Profile Configuration
spring.profiles.default=local

# Database Configuration
# Locally: defaults or overridden via application-local.properties
# Production: set these as env vars in Render/Cloud dashboard (SPRING_DATASOURCE_URL, etc.)
# Database Connection URL default with rewriteBatchedStatements=true for MySQL batch performance
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trainmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}

# HikariCP Enterprise Connection Pool Tuning (Sized for Render & Cloud DB resource limits)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA / Hibernate Configuration
# Schema is strictly managed by SQL/Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# High-throughput statement batching
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Disable Open-in-View
spring.jpa.open-in-view=false

# HTTP Response Compression (Minimizes transfer payload over cloud network)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Flyway Database Migration Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.connect-retries=3

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Application-level CORS allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:8081,https://*.vercel.app,https://*.onrender.com}

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Name
spring.application.name=TrainMate

# Jackson Configuration - serialize dates as ISO-8601 strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# SpringDoc OpenAPI - disable at startup, generate on first access
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.cache.disabled=false
